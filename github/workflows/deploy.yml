name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Деплой будет запускаться только при пуше в ветку main
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DATABASE_URL: "sqlite:///db.sqlite3"
          EMAIL_HOST: "localhost"
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "True"
          EMAIL_HOST_USER: "test@example.com"
          EMAIL_HOST_PASSWORD: "test"
          DEFAULT_FROM_EMAIL: "test@example.com"
          STRIPE_MOCK: "true"
        run: python manage.py test

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server via rsync
        uses: burnett01/rsync-deployments@v9 # Используем актуальную версию
        with:
          switches: -avzr --delete --exclude='.git*' --exclude='.venv' --exclude='venv' --exclude='__pycache__' --exclude='.env' --exclude='media' --exclude='staticfiles' --exclude='db.sqlite3'
          path: ./
          remote_path: /var/www/myproject
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3 # Используем актуальную версию
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e # Останавливать выполнение при любой ошибке
            cd /var/www/myproject
            
            # Пересобираем и перезапускаем контейнеры
            # Файл .env уже существует на сервере и не будет перезаписан
            docker compose up -d --build
            
            # Применяем миграции и собираем статику
            docker compose exec -T web python manage.py migrate
            docker compose exec -T web python manage.py collectstatic --noinput
