          type: string
          format: uri
          readOnly: true
          title: Ссылка на оплату
        payment_status:
          type: string
          readOnly: true
          title: Статус оплаты в Stripe
        user:
          type: integer
          readOnly: true
          title: Пользователь
        paid_course:
          type: integer
          nullable: true
          title: Оплаченный курс
        paid_lesson:
          type: integer
          nullable: true
          title: Оплаченный урок
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        phone:
          type: string
          title: Телефон
          maxLength: 20
        city:
          type: string
          title: Город
          maxLength: 100
        avatar:
          type: string
          format: uri
          nullable: true
          title: Аватарка
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          readOnly: true
    Payment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        payment_date:
          type: string
          format: date-time
          readOnly: true
          title: Дата оплаты
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Сумма оплаты
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentPaymentMethodEnum'
          title: Способ оплаты
        stripe_product_id:
          type: string
          readOnly: true
          title: ID продукта Stripe
        stripe_price_id:
          type: string
          readOnly: true
          title: ID цены Stripe
        stripe_session_id:
          type: string
          readOnly: true
          title: ID сессии Stripe
        payment_link:
          type: string
          format: uri
          readOnly: true
          title: Ссылка на оплату
        payment_status:
          type: string
          readOnly: true
          title: Статус оплаты в Stripe
        user:
          type: integer
          readOnly: true
          title: Пользователь
        paid_course:
          type: integer
          nullable: true
          title: Оплаченный курс
        paid_lesson:
          type: integer
          nullable: true
          title: Оплаченный урок
      required:
      - amount
      - id
      - payment_date
      - payment_link
      - payment_method
      - payment_status
      - stripe_price_id
      - stripe_product_id
      - stripe_session_id
      - user
    PaymentCreate:
      type: object
      properties:
        course_id:
          type: integer
          description: ID оплачиваемого курса
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Сумма в рублях (минимум 1.00)
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentCreatePaymentMethodEnum'
          default: transfer
          description: |-
            Способ оплаты

            * `cash` - cash
            * `transfer` - transfer
      required:
      - amount
      - course_id
    PaymentCreatePaymentMethodEnum:
      enum:
      - cash
      - transfer
      type: string
      description: |-
        * `cash` - cash
        * `transfer` - transfer
    PaymentCreateResponse:
      type: object
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        payment_url:
          type: string
          format: uri
      required:
      - payment
      - payment_url
    PaymentPaymentMethodEnum:
      enum:
      - cash
      - transfer
      type: string
      description: |-
        * `cash` - Наличные
        * `transfer` - Перевод на счет
    PaymentStatusResponse:
      type: object
      properties:
        session_id:
          type: string
        payment_status:
          type: string
        amount_total:
          type: integer
        currency:
          type: string
      required:
      - amount_total
      - currency
      - payment_status
      - session_id
    SubscriptionError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    SubscriptionRequest:
      type: object
      properties:
        course_id:
          type: integer
          description: ID курса, на который оформляется подписка.
      required:
      - course_id
    SubscriptionResponse:
      type: object
      properties:
        message:
          type: string
          description: «подписка добавлена» или «подписка удалена».
        is_subscribed:
          type: boolean
          description: Текущее состояние подписки после операции.
      required:
      - is_subscribed
      - message
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        phone:
          type: string
          title: Телефон
          maxLength: 20
        city:
          type: string
          title: Город
          maxLength: 100
        avatar:
          type: string
          format: uri
          nullable: true
          title: Аватарка
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          readOnly: true
      required:
      - email
      - id
      - payments
    UserCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 6
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        phone:
          type: string
          title: Телефон
          maxLength: 20
        city:
          type: string
          title: Город
          maxLength: 100
        avatar:
          type: string
          format: uri
          nullable: true
          title: Аватарка
      required:
      - email
      - id
      - password
    UserPublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          title: Имя
          maxLength: 150
        phone:
          type: string
          title: Телефон
          maxLength: 20
        city:
          type: string
          title: Город
          maxLength: 100
        avatar:
          type: string
          format: uri
          nullable: true
          title: Аватарка
      required:
      - email
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
